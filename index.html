<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matylda Drapich — Data Analyst / Machine Learning</title>
    <meta
      name="description"
      content="Portfolio Matyldy Drapich — studentki informatyki stosowanej na Politechnice Warszawskiej i Junior Data Analyst. Projekty z obszaru analizy danych, ML i inżynierii danych."
    />
    <meta name="author" content="Matylda Drapich" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:title" content="Matylda Drapich — Data Analyst / Machine Learning" />
    <meta
      property="og:description"
      content="Projekty z obszaru analizy danych, uczenia maszynowego i inżynierii danych."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <style>
      html.pre main,
      html.pre footer {
        visibility: hidden;
      }
    </style>
    <script>
      document.documentElement.classList.add("pre");
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>

    <header class="site-header" data-header>
      <div class="container header-inner">
        <a class="brand" href="#top">
          <span class="brand-mark" aria-hidden="true">MD</span>
          <span class="brand-name">Matylda Drapich</span>
        </a>

        <nav class="main-nav" id="main-nav" aria-label="Główna nawigacja" data-nav>
          <ul>
            <li><a href="#about" data-nav-link="about">O mnie</a></li>
            <li><a href="#projects" data-nav-link="projects">Projekty</a></li>
            <li><a href="#skills" data-nav-link="skills">Umiejętności</a></li>
            <li><a href="#timeline" data-nav-link="timeline">Doświadczenie</a></li>
            <li><a href="#contact" data-nav-link="contact">Kontakt</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button
            class="icon-btn"
            type="button"
            data-theme-toggle
            aria-label="Przełącz motyw jasny / ciemny"
            title="Przełącz motyw"
          >
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
          <button
            class="icon-btn menu-btn"
            type="button"
            data-menu-toggle
            aria-expanded="false"
            aria-controls="main-nav"
            aria-label="Otwórz menu"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path class="bar bar-1" d="M4 7h16" />
              <path class="bar bar-2" d="M4 12h16" />
              <path class="bar bar-3" d="M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
      <div class="scroll-progress" aria-hidden="true" data-progress></div>
    </header>

    <main id="main" tabindex="-1">
      <noscript>
        <p class="noscript">
          Ta strona wymaga włączonej obsługi JavaScript. Kontakt:
          <a href="mailto:matyldadrapich@gmail.com">matyldadrapich@gmail.com</a> ·
          <a href="https://github.com/mat787">GitHub</a> ·
          <a href="https://www.linkedin.com/in/matylda-drapich">LinkedIn</a>.
        </p>
      </noscript>

      <section class="hero" id="top" aria-labelledby="hero-title" data-hero></section>

      <section class="section" id="about" aria-labelledby="about-title" data-about></section>

      <section class="section section-alt" id="projects" aria-labelledby="projects-title">
        <div class="container">
          <div class="section-head" data-reveal>
            <p class="eyebrow">Projekty</p>
            <h2 id="projects-title">Wybrane projekty</h2>
            <p class="lead">
              Filtruj według obszaru, a po kliknięciu w kartę zobaczysz szczegóły, stos technologiczny i linki.
            </p>
          </div>
          <div class="filters" role="group" aria-label="Filtruj projekty" data-project-filters></div>
          <p class="filter-status" role="status" aria-live="polite" data-filter-status></p>
          <div class="project-grid" data-project-grid></div>
        </div>
      </section>

      <section class="section" id="skills" aria-labelledby="skills-title" data-skills></section>

      <section class="section section-alt" id="timeline" aria-labelledby="timeline-title" data-timeline></section>

      <section class="section" id="contact" aria-labelledby="contact-title" data-contact></section>
    </main>

    <footer class="site-footer" data-footer></footer>

    <dialog class="project-modal" data-modal aria-labelledby="modal-title">
      <div class="modal-panel" data-modal-panel></div>
    </dialog>

    <div class="toast" role="status" aria-live="polite" data-toast></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
